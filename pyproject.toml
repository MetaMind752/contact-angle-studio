[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-angle-core"
version = "0.5.2"
description = "Local sessile and inverted contact angle measurement with OpenCV, SciPy and FastAPI"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3", "opencv-python-headless>=4.10,<5", "scipy>=1.14,<2",
  "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.32,<1",
  "python-multipart>=0.0.18,<1", "pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
contact-angle = "contact_angle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contact_angle = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmark/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
